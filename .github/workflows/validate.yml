name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require core files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
      - name: Each specialist has SOUL, AGENTS, and one skill
        run: |
          set -euo pipefail
          for p in templates/profiles/*; do
            test -f "$p/SOUL.md"
            test -f "$p/AGENTS.md"
            test -d "$p/skills"
            n=$(find "$p/skills" -name SKILL.md | wc -l)
            test "$n" -eq 1
          done
